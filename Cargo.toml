[package]
name = "pico"
version = "0.40.1"
edition = "2021"
description = "Pico 0.40.1 by @iK4w4 \u2014 a tiny neumorphic Windows browser for local development (Rust + tao/wry WebView2): auto-detected localhost services, a download manager (multi-connection downloads, pause/resume across restarts, a live-speed popover and a full downloads page), a three-layer Shield (filter lists downloaded on first run from EasyList / EasyPrivacy / uBlock Origin and cached beside the exe), Lite mode with chosen-video semantics, a start-page savings band, sixteen palette themes, and portable data (state, log, lists and profile in data\\ beside the exe). Ships with NO embedded manifest (zero RT_MANIFEST, gate-verified); the only resource is an icon-only .rsrc compiled by llvm-rc from a generated .ico."
license = "MIT"

[lib]
name = "pico_core"
path = "src/lib.rs"

[[bin]]
name = "Pico"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:tao", "dep:wry", "dep:notify", "dep:rfd", "dep:webview2-com", "dep:windows-core"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = { version = "0.34", optional = true }
wry = { version = "0.53", features = ["devtools"], optional = true }
notify = { version = "7", optional = true }
rfd = { version = "0.15", optional = true }

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.38", optional = true }
windows-core = { version = "0.61", optional = true }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    # v25: GetAdaptersAddresses + IP_ADAPTER_ADDRESSES_LH are
    # gated on Ndis types (IF_OPER_STATUS) in windows-sys 0.59 —
    # same crate, one more feature flag, no new dependency.
    "Win32_NetworkManagement_Ndis",
    # 0.32: WinHttp* for the download manager's transport
    # (src/winhttp.rs) — same crate, one more feature flag,
    # no new dependency (precedent: the Ndis flag above).
    "Win32_Networking_WinHttp",
    # 0.32.1: GetDiskFreeSpaceExW for the download disk-fill
    # guard (src/downloads.rs) — same crate, one more flag.
    "Win32_Storage_FileSystem",
    # 0.34.1: the clipboard format/open/get/set calls for
    # Pico's own context menu (src/app.rs) — same crate, one
    # more feature flag, no new dependency (precedent: the
    # FileSystem flag above).
    "Win32_System_DataExchange",
    # 0.34.1: GlobalAlloc/GlobalLock/GlobalUnlock/GlobalSize
    # for the clipboard text hand-off — same crate, one more
    # flag (GlobalFree itself lives in Win32_Foundation,
    # already enabled above).
    "Win32_System_Memory",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # 0.35: GetKeyState + VK_CONTROL for the content
    # webviews' Ctrl+J downloads accelerator (src/app.rs)
    # — same crate, one more feature flag, no new
    # dependency (precedent: the DataExchange flag above).
    "Win32_UI_Input_KeyboardAndMouse",
] }

# NOTE: no build-dependencies, no build.rs, no embed-manifest, no winres.
# Pico must link with NO RT_MANIFEST — gate v2 in scripts/ proves it
# on the final binary. v24's ONE resource is assets/pico.res, an
# ICON-ONLY .res compiled by llvm-rc from scripts/gen_icon.py's
# pico.ico, CHECKED IN and linked via .cargo/config.toml's
# link-arg — no build-time resource toolchain is needed, and
# nothing else (no manifest, no version info) is in it. See
# BUILD_NOTES.md for the forensic rationale.

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
